services:
  api:
    build:
      context: ./SaasVistoria
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=db;Port=5432;Database=vistora;Username=vistora;Password=${POSTGRES_PASSWORD:-vistora_dev}
      Jwt__Key: ${JWT_KEY:-troque-esta-chave-em-producao-com-ao-menos-32-caracteres}
    ports: ["8080:8080"]
    depends_on: [db]
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vistora
      POSTGRES_USER: vistora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vistora_dev}
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
volumes: { postgres_data: {} }
