name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restaurar (com lockfile)
        run: dotnet restore SaasVistoria.slnx --locked-mode

      - name: Build
        run: dotnet build SaasVistoria.slnx --no-restore -c Release

      - name: Testes
        run: dotnet test SaasVistoria.slnx --no-build -c Release --logger "trx;LogFileName=test-results.trx"

      - name: Publicar resultados dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
